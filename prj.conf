CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_DEVICE_NAME="IRKollector"
# The name is extended with the last two address bytes at boot, see main.c
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
# Appearance: HID keyboard. Together with the HID service UUID in the advertising data this
# makes the device show up in the regular Bluetooth settings menus on Android and iOS.
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_REMOTE_INFO=y
CONFIG_BT_REMOTE_VERSION=y
# GATT client: used to read the phone's Device Name after pairing
CONFIG_BT_GATT_CLIENT=y
# HID over GATT requires a Battery service next to HID and DIS (iOS may rely on it)
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y

# Pairing: Just Works bonding, bonds (and thus peer IRKs) persisted in flash
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_MAX_PAIRED=16
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

CONFIG_GPIO=y
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_ASSERT=y
